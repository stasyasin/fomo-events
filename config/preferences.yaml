# Conservative starter values, not final personal budget decisions. Edit before scanning.
pricing:
  currency: EUR
  preferred_max_per_person: 80
  hard_max_per_person: 180
  free_events_bonus: 10

travel:
  default_transport: public_transport
  max_minutes: 90
  exceptional_max_minutes: 180

ranking:
  weights:
    personal_interest: 10
    category: 5
    favourite_artist_or_team: 15
    free_event: 12
    rarity: 8
    language_fit: 8
    travel_convenience: 6
    price_value: 6
    urgency: 5
    ukrainian_event: 14
    english_standup: 12
    fireworks_or_drone_show: 14
    major_local_concert: 12
    ogc_nice_home_match: 16
    nearby_tennis_tournament: 12
    curated_cinema_pick: 12
    open_air_concert_or_dj: 12
    hands_on_creative_workshop: 10
    locally_visible_astronomy: 18
    wine_or_food_festival: 10
    unusual_core_zone_event: 10
    expensive_weak_fit_penalty: -8
    nonexceptional_long_distance_penalty: -10
    text_heavy_french_theatre_penalty: -7
    generic_recurring_low_novelty_penalty: -6
  levels:
    must_go_min: 32
    strong_match_min: 20
    maybe_min: 9

outputs:
  upcoming_markdown: true
  daily_reports: true
  weekly_reports: true
  static_site: true

privacy:
  public_repository_safe: true
